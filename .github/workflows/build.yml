name: Build

# 通常の push / PR ではビルドとテストだけ。リリースは release.yml（手動実行）で行う。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ProjectLauncher.sln

      - name: Build
        run: dotnet build ProjectLauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test ProjectLauncher.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

      # 単一 exe の発行が壊れていないかの確認。成果物は 7 日だけ置く（試しに落として使ってもいい）
      - name: Publish (smoke)
        run: >
          dotnet publish src/ProjectLauncher.App/ProjectLauncher.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
          -o publish

      - name: Show exe size
        run: Get-ChildItem publish | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLauncher-ci-${{ github.run_number }}
          path: publish/ProjectLauncher.exe
          retention-days: 7
